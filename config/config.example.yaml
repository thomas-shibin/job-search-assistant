candidate:
  name: "Candidate Name"
  base_resume: "./data/resumes/base_resume.docx"
  # By default the name parsed off your resume's own header wins over `name`
  # above (which is easy to forget to edit). Set true to force `name` to
  # always win instead, e.g. for a different spelling/nickname than the file.
  override_parsed_name: false

address_profiles:
  british_columbia:
    city: "Victoria"
    province: "BC"
    country: "Canada"

  ontario:
    city: "Toronto"
    province: "ON"
    country: "Canada"

search_profiles:
  - name: "BC Backend"
    enabled: true
    locations:
      - "Victoria, BC"
      - "Vancouver, BC"
      - "Remote Canada"
    address_profile: "british_columbia"
    titles:
      - "Senior Software Engineer"
      - "Senior Backend Engineer"
      - "Senior Java Developer"
      - "Staff Software Engineer"
    # Automated discovery (Milestone 12), on top of manual `discover`: public,
    # unauthenticated job-board APIs. Board tokens/company slugs are the same
    # ones in the company's careers-page URL, e.g. boards.greenhouse.io/<token>
    # or jobs.lever.co/<company>. Empty by default -- scheduler.enabled and
    # `run`/`serve` only ever poll what's listed here.
    greenhouse_boards: []
    lever_companies: []
    # Adzuna: a job-aggregator API (covers many employers per query, not just
    # one ATS board) -- searches using the `titles`/`locations` above. Needs
    # ADZUNA_APP_ID/ADZUNA_APP_KEY in .env (free signup at
    # developer.adzuna.com); disabled here until those are set.
    adzuna_enabled: false
    adzuna_country: "ca"

  - name: "Ontario Backend"
    enabled: true
    locations:
      - "Toronto, ON"
      - "Mississauga, ON"
    address_profile: "ontario"
    titles:
      - "Senior Software Engineer"
      - "Senior Backend Engineer"
      - "Senior Java Developer"

matching:
  minimum_score: 75

  required_or_high_value_skills:
    - Java
    - Spring Boot
    - REST APIs
    - Distributed Systems

  preferred_skills:
    - AWS
    - Kubernetes
    - Docker
    - PostgreSQL
    - MongoDB
    - Kafka
    - OAuth2
    - Keycloak

  negative_keywords:
    - "Frontend Developer"
    - "React Developer"
    - "PHP Developer"
    - "iOS Developer"

  # Must sum to 100. See docs/ARCHITECTURE.md for the scoring model.
  weights:
    technical_skills: 30
    relevant_experience: 20
    title_similarity: 15
    seniority: 10
    platform: 10
    location: 5
    domain_experience: 5
    education: 5

# AI-based job-requirement extraction (Milestone 5). Disabled by default so
# `analyze` never makes a billed call until you opt in here and set
# OPENAI_API_KEY in .env. Set provider to "mock" to exercise this pipeline
# stage with a free, deterministic heuristic instead of a real API call.
ai:
  enabled: false
  provider: openai
  model: gpt-4o-mini
  # Off by default: the deterministic, templated explanation (see "Analyzing
  # jobs" in the README) is free and reproducible. Turning this on replaces
  # it with an AI-polished version, at the cost of one extra call per job.
  generate_match_explanations: false

resume:
  optimize_keywords: true
  reorder_bullets: true
  tailor_summary: true
  tailor_skills: true
  change_address: true
  maximum_pages: 2
  never_invent_experience: true

notifications:
  minimum_score: 80

scheduler:
  enabled: true
  interval_minutes: 15
