# Starting settings for a new installation. They're imported into the database
# the first time the app starts; after that, change everything on the
# dashboard's Settings and Watchlist pages (edits to this file are ignored unless
# re-imported with `python cli.py import-config --force`). Upload your resume on
# the "My resume" page.
candidate:
  name: "Your Name"
  # Set automatically when you upload a resume on the "My resume" page.
  base_resume: "./data/resumes/base_resume.docx"
  # By default the name read from your resume's header wins over `name` above.
  # Set true to always use `name` instead (e.g. a nickname or different spelling).
  override_parsed_name: false

# Addresses for tailored resumes (Settings -> Address profiles). Optional: with
# none, a tailored resume shows the job's own city and province; with one, that
# address is always used; with several, the one in the job's province is used.
# street/unit/postal_code are optional -- with a street the full address is shown.
address_profiles: {}
#  home:
#    street: "1234 Example St"
#    unit: "Unit 5"
#    city: "Toronto"
#    province: "ON"
#    postal_code: "M5V 1A1"
#    country: "Canada"

# The job search used by the Find jobs page and by scheduled scans: one search
# per title x location. Empty lists search every job in `country`.
# Needs ADZUNA_APP_ID / ADZUNA_APP_KEY in .env (free at developer.adzuna.com).
search:
  titles: []
  locations: []
  keywords: []
  country: "ca"
  scan_in_background: true
  adzuna_daily_limit: 250

# Company job boards (Greenhouse / Lever) to watch, e.g.
#  - name: "My companies"
#    address_profile: ""
#    greenhouse_boards: ["shopify"]     # from boards.greenhouse.io/<token>
#    lever_companies: ["netflix"]       # from jobs.lever.co/<company>
search_profiles: []

matching:
  minimum_score: 75
  # Skills that matter most for your target roles, e.g. ["Java", "AWS"].
  required_or_high_value_skills: []
  preferred_skills: []
  # Job titles to skip, e.g. ["Intern", "PHP Developer"].
  negative_keywords: []
  # Must sum to 100.
  weights:
    technical_skills: 30
    relevant_experience: 20
    title_similarity: 15
    seniority: 10
    platform: 10
    location: 5
    domain_experience: 5
    education: 5

# AI (needs OPENAI_API_KEY in .env). "Analyze with AI" and resume tailoring use it
# whenever you click them; `enabled` additionally runs AI requirement extraction
# on every job scheduled scans find (a small cost per job).
ai:
  enabled: false
  provider: openai
  model: gpt-4o-mini
  generate_match_explanations: false

resume:
  optimize_keywords: true
  reorder_bullets: true
  tailor_summary: true
  tailor_skills: true
  change_address: true
  maximum_pages: 2
  never_invent_experience: true

notifications:
  minimum_score: 80

# Telegram alerts for new jobs matching a watch (set up on the Watchlist page).
watchlist:
  enabled: false
  max_alerts_per_run: 15
  watches: []

scheduler:
  enabled: true
  interval_minutes: 60
