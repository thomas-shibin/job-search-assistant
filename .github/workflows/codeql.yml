# SAST: GitHub CodeQL for the Python code and the browser JavaScript
# (app/web/static/app.js). Free for public repositories; results appear under
# the repository's Security -> Code scanning tab.
name: CodeQL

on:
  push:
    branches: [master, prod, dev]
  pull_request:
  schedule:
    - cron: "41 6 * * 1"  # Mondays 06:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write  # upload the results to Code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: /language:${{ matrix.language }}
