# The private image registry on the home server, for production images
# (scripts/release.sh pushes them here, then the server pulls from it).
#
# It listens on the server's own 127.0.0.1 only: nothing on the network can reach
# it. Your computer pushes through an SSH tunnel (release.sh opens it), so the
# only way in is your SSH login -- no passwords or TLS certificates to manage,
# and Docker allows plain http to 127.0.0.1 without any daemon setting.
#
# Set up once (release.sh --setup-registry does these steps for you):
#   sudo mkdir -p /srv/hirlumo-registry && sudo chown 1000:1000 /srv/hirlumo-registry
#   sudo docker compose -f deploy/registry/docker-compose.yml up -d
name: hirlumo-registry

services:
  registry:
    image: registry:3.1.2
    restart: unless-stopped
    user: "${REGISTRY_UID:-1000}:${REGISTRY_GID:-1000}"
    ports:
      - "127.0.0.1:${REGISTRY_PORT:-5000}:5000"
    environment:
      # Lets old versions be removed (see INSTALL.md, "Releases").
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      OTEL_TRACES_EXPORTER: none
    volumes:
      - type: bind
        source: ${REGISTRY_DATA_DIR:-/srv/hirlumo-registry}
        target: /var/lib/registry
        bind:
          create_host_path: false
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3
