[project]
name = "hirlumo"
version = "0.1.0"
description = "Hirlumo: job search for Canada, with resumes tailored to every job"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openai>=1.30",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "cryptography>=42",  # encrypting backups before they leave the server
    "boto3>=1.34",  # copying backups to S3-compatible storage (Cloudflare R2, B2, S3)
    "win10toast>=0.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "reportlab>=4.0",
]

[project.scripts]
hirlumo = "cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Code hygiene (CI: `ruff check .`). Real-bug rules: pyflakes (unused or undefined
# names), syntax and statement errors, bugbear. Left out on purpose: B008 (FastAPI's
# `Depends()` defaults), B904/B905, E402 (imports after setup in tests and
# scripts) and E741 (`l` is the place box's query parameter).
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["alembic/versions", "tmp", "dist", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "PLE"]
ignore = ["B008", "B904", "B905", "E402", "E741"]

# SAST (CI: `bandit -c pyproject.toml -r app main.py cli.py`).
[tool.bandit]
exclude_dirs = ["tests", "alembic", ".venv", "tmp"]
