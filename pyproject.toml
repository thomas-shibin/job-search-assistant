[project]
name = "job-search-assistant"
version = "0.1.0"
description = "Local AI Job Application Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openai>=1.30",
    "argon2-cffi>=23.1",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "win10toast>=0.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "reportlab>=4.0",
]

[project.scripts]
jobassistant = "cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cli", "main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
