<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Job Application Assistant{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
</head>
<body hx-boost="true">
  <header class="topbar">
    <a class="brand" href="/">Job Application Assistant</a>
    <nav>
      <a href="/">Jobs</a>
      <a href="/costs">AI Costs</a>
    </nav>
  </header>
  <main>
    {% if message %}<div class="flash">{{ message }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
