{# Save / Saved toggle for one search result; swaps itself via htmx. #}
{% if feature("saved_jobs") %}
<span class="save-slot" id="save-{{ ref }}">
{% if saved_job_id %}
  <form method="post" action="/saved/{{ saved_job_id }}/remove" hx-post="/saved/{{ saved_job_id }}/remove" hx-target="closest .save-slot" hx-swap="outerHTML">
    <input type="hidden" name="ref" value="{{ ref }}"><input type="hidden" name="next" value="/jobs">
    <button type="submit" class="pill outline saved" aria-pressed="true" title="Remove from saved jobs">{% from "_icons.html" import icon %}{{ icon("bookmark") }} Saved</button>
  </form>
{% else %}
  <form method="post" action="/saved" hx-post="/saved" hx-target="closest .save-slot" hx-swap="outerHTML">
    <input type="hidden" name="ref" value="{{ ref }}"><input type="hidden" name="next" value="/saved">
    <button type="submit" class="pill outline" aria-pressed="false">{% from "_icons.html" import icon %}{{ icon("bookmark") }} Save</button>
  </form>
{% endif %}
</span>
{% endif %}
