{% extends "auth/base.html" %}
{% block title %}Choose a new password - Hirlumo{% endblock %}
{% block layout %}single{% endblock %}
{% block aside %}{% endblock %}
{% block card %}
<h1 class="flow-title">Choose a new password</h1>
<p class="flow-sub">You'll be signed out on every other device.</p>
<form method="post" action="/reset-password" class="auth-form">
  <input type="hidden" name="token" value="{{ token }}">
  <div class="field">
    <label for="rp-password">New password</label>
    <div class="input-with-action">
      <input type="password" id="rp-password" name="password" autocomplete="new-password" required minlength="8" maxlength="128" autofocus>
      <button type="button" class="input-action" data-password-toggle="rp-password" aria-label="Show password" aria-pressed="false">Show</button>
    </div>
    <small class="field-hint">{{ password_rules }}</small>
  </div>
  <div class="field">
    <label for="rp-confirm">Confirm new password</label>
    <div class="input-with-action">
      <input type="password" id="rp-confirm" name="confirm_password" autocomplete="new-password" required>
      <button type="button" class="input-action" data-password-toggle="rp-confirm" aria-label="Show password" aria-pressed="false">Show</button>
    </div>
  </div>
  <button type="submit" class="primary pill large wide">Save password</button>
</form>
{% endblock %}
